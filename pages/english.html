<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inglés · Roadmap Analista de Datos</title>
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/layout.css" />
</head>

<body>

<header class="nav">
  <div class="brand">Roadmap · Analista de Datos</div>
  <nav>
    <a href="../index.html">Inicio</a>
  </nav>
</header>

<main class="container">

  <section class="page-title">
    <h1>Inglés Técnico</h1>
    <p>Vocabulario esencial para el análisis de datos.</p>
  </section>

  <section class="content-layout">
    <div class="cards-section">
      <div id="cardsContainer"></div>
    </div>
    <div class="form-section">
      <form id="cardForm" class="card" style="cursor: default;">
        <div class="card__top">
          <span class="tag tag--english">Inglés</span>
        </div>
        <h2 class="card__title">Nueva tarjeta</h2>
        <input type="text" id="title" placeholder="Título (ej: Database Terms)" required style="margin-bottom: .5rem;" />
        <textarea id="description" placeholder="Descripción" required rows="2" style="margin-bottom: .5rem;" ></textarea>
        <textarea id="content" placeholder="Ejemplo (ejemplos, tips)" required rows="5" ></textarea>
        <button class="btn btn--primary" style="margin-top: .75rem;"> Crear tarjeta </button>
      </form>
    </div>
  </section>

</main>

<footer class="footer">
  <p>Constancia &gt; motivación</p>
</footer>

<script src="../js/storage.js"></script>
<script src="../js/script-english.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const nodeId = 'ingles'; // ID del nodo

  // Inicializar progreso
  const checkbox = document.getElementById('complete-' + nodeId);
  const progress = getProgress();
  if (progress[nodeId] === 'done') {
    checkbox.checked = true;
  }

  checkbox.addEventListener('change', () => {
    setProgress(nodeId, checkbox.checked ? 'done' : 'todo');
  });
});
</script>
</body>
</html>
